[package]
name = "magnexis-fiscalwatch"
version = "1.3.0"
description = "Local-first fiscal accountability research workspace"
authors = ["Magnexis"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# On Windows the native TLS backend uses SChannel. It avoids the `ring` archive
# toolchain path while retaining HTTPS certificate validation for public APIs.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
url = "2"
