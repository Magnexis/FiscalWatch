name: Verify FiscalWatch

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python -m unittest discover -s tests -p test_*.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - run: npx tsx scripts/render-reports.ts
      - run: git diff --exit-code -- docs public/reports
